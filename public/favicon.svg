  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffcc33" stroke-opacity="0.18" />

  <text
    x="32"
