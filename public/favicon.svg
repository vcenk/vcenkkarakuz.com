      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="mono" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd633" />
